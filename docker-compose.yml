services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - SESSION_SECRET=${SESSION_SECRET}
      - SEED_MEMBERS=${SEED_MEMBERS}
      - COOKIE_SECURE=${COOKIE_SECURE:-1}
    volumes:
      - ./devocionais:/srv/devocionais
      - db_data:/srv/app/data
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db_data:
  caddy_data:
  caddy_config:
