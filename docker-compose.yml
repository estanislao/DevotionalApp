services:
  app:
    build: .
    restart: unless-stopped
    mem_limit: 768m
    pids_limit: 256
    # Endurecimento: o sistema de arquivos da imagem é só leitura (o app grava apenas nos dois volumes
    # abaixo e em /tmp), sem nenhuma capability de root e sem poder ganhar privilégio.
    read_only: true
    tmpfs:
      - /tmp:size=300m   # uploads grandes passam por aqui antes de ir para o disco (conta no mem_limit)
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/login', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      - SESSION_SECRET=${SESSION_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_NAME=${ADMIN_NAME:-Administrador}
      - COOKIE_SECURE=${COOKIE_SECURE:-1}
      - CADASTRO_CODIGO=${CADASTRO_CODIGO:-}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Trilha de Fé}
      # Só confia no X-Forwarded-For (o IP real do visitante, posto pelo Caddy) quando a conexão vem do gateway
      # da rede abaixo, que é por onde o Caddy da VM chega ao contêiner. Qualquer outra origem é ignorada.
      - FORWARDED_ALLOW_IPS=172.29.0.1
    volumes:
      - ./devocionais:/srv/devocionais
      - db_data:/srv/app/data
    # Só a própria VM enxerga essa porta. Quem expõe na internet é o Caddy.
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8600}:8000"

  # Caddy próprio, para uma VM dedicada. Numa VM que já tem Caddy/Nginx
  # nas portas 80/443, não suba este serviço: aponte o proxy existente
  # para 127.0.0.1:8600 (veja o README).
  caddy:
    image: caddy:2-alpine
    profiles: ["standalone"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db_data:
  caddy_data:
  caddy_config:

# Rede com faixa fixa: o gateway (172.29.0.1) precisa ser previsível para a linha FORWARDED_ALLOW_IPS acima.
# 172.29.0.0/24 não colide com as outras redes da VM; se colidir noutra máquina, troque a faixa E o gateway acima.
networks:
  default:
    ipam:
      config:
        - subnet: 172.29.0.0/24
          gateway: 172.29.0.1
