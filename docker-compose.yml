services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - SESSION_SECRET=${SESSION_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_NAME=${ADMIN_NAME:-Administrador}
      - COOKIE_SECURE=${COOKIE_SECURE:-1}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Trilha de Fé}
    volumes:
      - ./devocionais:/srv/devocionais
      - db_data:/srv/app/data
    # Só a própria VM enxerga essa porta. Quem expõe na internet é o Caddy.
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8600}:8000"

  # Caddy próprio, para uma VM dedicada. Numa VM que já tem Caddy/Nginx
  # nas portas 80/443, não suba este serviço: aponte o proxy existente
  # para 127.0.0.1:8600 (veja o README).
  caddy:
    image: caddy:2-alpine
    profiles: ["standalone"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  db_data:
  caddy_data:
  caddy_config:
