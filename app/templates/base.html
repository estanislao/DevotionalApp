<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Trilha de Fé{% endblock %}</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2E3192">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png?v=2">
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<meta name="apple-mobile-web-app-title" content="Trilha de Fé">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap">
<link rel="stylesheet" href="/static/css/style.css?v=4">
</head>
<body>
<div class="app {% block app_class %}{% endblock %}">
{% block content %}{% endblock %}
</div>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
}
</script>
<script>
// "Mostrar senha": um botão ao lado do último campo de senha de cada formulário.
document.querySelectorAll('form').forEach((form) => {
  const campos = form.querySelectorAll('input[type=password]');
  if (!campos.length) return;
  const alvo = campos[campos.length - 1].closest('.campo') || campos[campos.length - 1];
  const rotulo = document.createElement('label');
  rotulo.className = 'mostrar-senha';
  rotulo.innerHTML = '<input type="checkbox"> Mostrar senha';
  rotulo.querySelector('input').addEventListener('change', (e) => {
    campos.forEach((c) => { c.type = e.target.checked ? 'text' : 'password'; });
  });
  alvo.after(rotulo);
});
</script>
</body>
</html>
