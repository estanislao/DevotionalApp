<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Portal de Devocionais{% endblock %}</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2E3192">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="app {% block app_class %}{% endblock %}">
{% block content %}{% endblock %}
</div>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
}
</script>
</body>
</html>
