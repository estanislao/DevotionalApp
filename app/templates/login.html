{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<div class="login-wrap">
  <div style="text-align:center; display:flex; flex-direction:column; gap:6px">
    <h1 style="margin:0; font-size:26px; font-weight:700">Portal de devocionais</h1>
    <p style="margin:0; color:var(--text-soft); font-size:15px">Escolha quem é você e digite o PIN</p>
  </div>
  {% if erro_msg %}
    <p class="erro">{{ erro_msg }}</p>
  {% endif %}
  <form method="post" action="/login" id="form-login" style="display:flex; flex-direction:column; gap:20px">
    <input type="hidden" name="member_id" id="member_id">
    <div class="membro-grid">
      {% for m in members %}
        <button type="button" class="membro-btn" data-id="{{ m['id'] }}" onclick="selecionar(this)">
          <span class="familia-avatar" style="width:48px;height:48px;border-radius:24px">{{ m['name'][:1] }}</span>
          <span style="font-weight:600; font-size:14px">{{ m['name'] }}</span>
        </button>
      {% endfor %}
    </div>
    <input class="pin-input" type="password" inputmode="numeric" name="pin" placeholder="••••" maxlength="6" required>
    <button type="submit" class="btn-primary">Entrar</button>
  </form>
</div>
<script>
function selecionar(btn) {
  document.querySelectorAll('.membro-btn').forEach(b => b.classList.remove('selecionado'));
  btn.classList.add('selecionado');
  document.getElementById('member_id').value = btn.dataset.id;
}
</script>
{% endblock %}
