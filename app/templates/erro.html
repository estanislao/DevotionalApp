{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="login-wrap">
  <div style="text-align:center; display:flex; flex-direction:column; gap:10px">
    <h1 style="margin:0; font-size:24px; font-weight:700">{{ titulo }}</h1>
    <p style="margin:0; color:var(--text-soft); font-size:15px; line-height:1.5">{{ mensagem }}</p>
  </div>
  <a href="{{ voltar_url }}" class="btn-primary" style="display:flex; align-items:center; justify-content:center; text-decoration:none">{{ voltar_texto }}</a>
  {% if extra_url %}<a href="{{ extra_url }}" style="text-align:center; font-size:14px; font-weight:600">{{ extra_texto }}</a>{% endif %}
</div>
{% endblock %}
