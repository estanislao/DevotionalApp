{% extends "base.html" %}
{% block title %}Criar conta{% endblock %}
{% block content %}
<div class="login-wrap">
  <div style="text-align:center; display:flex; flex-direction:column; gap:6px">
    <h1 style="margin:0; font-size:24px; font-weight:700">Criar conta</h1>
    <p style="margin:0; color:var(--text-soft); font-size:15px; line-height:1.5">Sua inscrição vai para o administrador aprovar. Depois é só entrar.</p>
  </div>
  {% if erro_msg %}<p class="erro">{{ erro_msg }}</p>{% endif %}
  <form method="post" action="/cadastro" style="display:flex; flex-direction:column; gap:14px">
    <div class="campo"><label for="nome">Seu nome</label><input id="nome" name="nome" type="text" value="{{ nome }}" required maxlength="60" autocomplete="name"></div>
    <div class="campo"><label for="email">E-mail</label><input id="email" name="email" type="email" value="{{ email }}" required autocomplete="email" inputmode="email" autocapitalize="none"></div>
    <div class="campo"><label for="senha">Senha (mínimo {{ senha_min }} caracteres)</label><input id="senha" name="senha" type="password" required minlength="{{ senha_min }}" autocomplete="new-password"></div>
    <div class="campo"><label for="senha2">Repita a senha</label><input id="senha2" name="senha2" type="password" required minlength="{{ senha_min }}" autocomplete="new-password"></div>
    <button type="submit" class="btn-primary" style="margin-top:6px">Enviar inscrição</button>
  </form>
  <a href="/login" style="text-align:center; font-size:14px; font-weight:600">Já tenho conta</a>
</div>
{% endblock %}
