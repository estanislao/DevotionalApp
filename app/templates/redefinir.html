{% extends "base.html" %}
{% block title %}Nova senha{% endblock %}
{% block content %}
<div class="login-wrap">
  <div style="text-align:center; display:flex; flex-direction:column; gap:6px">
    <h1 style="margin:0; font-size:24px; font-weight:700">Nova senha, {{ nome }}</h1>
    <p style="margin:0; color:var(--text-soft); font-size:15px">Mínimo de {{ senha_min }} caracteres.</p>
  </div>
  {% if erro_msg %}<p class="erro">{{ erro_msg }}</p>{% endif %}
  <form method="post" action="/redefinir/{{ token }}" style="display:flex; flex-direction:column; gap:14px">
    <div class="campo"><label for="senha">Nova senha</label><input id="senha" name="senha" type="password" required minlength="{{ senha_min }}" autocomplete="new-password"></div>
    <div class="campo"><label for="senha2">Repita a senha</label><input id="senha2" name="senha2" type="password" required minlength="{{ senha_min }}" autocomplete="new-password"></div>
    <button type="submit" class="btn-primary" style="margin-top:6px">Salvar senha</button>
  </form>
</div>
{% endblock %}
